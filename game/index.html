<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iron Fist</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="img/icon.png">
</head>
<body>

<div id="start">
  <div class="start-bg"></div>
  <div class="start-inner">
    <header class="start-head">
      <img class="start-logo" src="img/logo.jpg" alt="">
      <div><h1>IRON FIST</h1>
      <p class="sub">Europa, 1° gennaio 1936. Scegli la nazione da guidare attraverso la tempesta.</p></div>
    </header>
    <div class="start-body">
      <section class="start-list">
        <h2>Grandi potenze</h2>
        <div id="majors" class="cgrid"></div>
        <h2>Nazioni minori</h2>
        <div id="minors" class="cgrid"></div>
      </section>
      <aside id="start-pick" class="start-pick"></aside>
    </div>
    <details><summary>Come si gioca</summary><div id="start-help"></div></details>
  </div>
</div>

<div id="game" class="hidden">
  <main id="mapwrap">
    <canvas id="map"></canvas>
    <div id="tooltip" class="hidden"></div>
  </main>

  <header id="topbar">
    <button id="tb-country" data-open="politica" title="Politica"></button>
    <nav id="tabs"></nav>
    <div id="tb-res"></div>
    <div id="tb-war"></div>
    <div id="tb-time">
      <div id="tb-date"></div>
      <div id="tb-speed"></div>
    </div>
    <button id="btn-help" class="tb-icon" title="Aiuto"></button>
  </header>
  <div id="alerts"></div>

  <section id="panel" class="hidden">
    <header id="panel-head"></header>
    <div id="panel-body"></div>
  </section>

  <section id="logbox" class="collapsed">
    <button id="log-toggle"></button>
    <div id="log"></div>
  </section>

  <section id="unitbar" class="hidden"></section>
  <nav id="mapmodes" class="hidden"></nav>
</div>

<div id="modal-bg" class="hidden"><div id="modal"></div></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/render.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui-panels.js"></script>
<!-- PANELS:BEGIN  (un file per sistema: aggiungi qui il tuo <script src="js/panels/...">) -->
<!-- PANELS:END -->
<script src="js/main.js"></script>
</body>
</html>
